<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tela Compartilhada</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{--bg:#0d0d0f;--card:#17171b;--line:#2a2a31;--txt:#f2f2f4;--mut:#8b8b96;--acc:#5b7cff;--red:#ff4d5e}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);flex-shrink:0}
  .brand{font-weight:700;font-size:18px}
  .brand small{display:block;font-weight:400;font-size:12px;color:var(--mut);margin-top:2px}
  .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  button{border:0;border-radius:10px;padding:10px 16px;font:600 14px system-ui;cursor:pointer;color:var(--txt);background:var(--card);border:1px solid var(--line)}
  button:hover{border-color:#44444f}
  button.primary{background:var(--acc);border-color:var(--acc)}
  button.stop{background:var(--red);border-color:var(--red)}
  .pill{font-size:13px;color:var(--mut);padding:8px 12px;border:1px solid var(--line);border-radius:999px}
  .pill b{color:var(--txt)}
  #status{font-size:12px;color:var(--mut);padding:6px 16px;flex-shrink:0}
  #grid{flex:1;min-height:0;display:grid;gap:10px;padding:0 16px 16px;grid-template-columns:1fr;grid-template-rows:1fr}
  #grid.focus{grid-template-columns:1fr !important;grid-template-rows:minmax(0,1fr) 130px !important}
  #grid.focus.solo{grid-template-rows:minmax(0,1fr) !important}
  .tile{position:relative;background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0;min-height:0;cursor:pointer;transition:border-color .15s}
  .tile:hover{border-color:#55555f}
  .tile.focused{border-color:var(--acc);cursor:zoom-out}
  .tile video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
  .tile .bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;align-items:center;justify-content:space-between;padding:8px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
  .tile .bar span{font-size:13px;font-weight:600;padding-left:4px}
  .tile .bar div{display:flex;gap:6px}
  .tile .bar button{padding:6px 10px;font-size:12px;background:rgba(20,20,24,.85)}
  #empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--mut);padding:20px;border:1px dashed var(--line);border-radius:14px}
  #empty b{display:block;color:var(--txt);font-size:18px;margin-bottom:6px}
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
  #gate form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:14px}
  #gate h1{font-size:20px}
  #gate p{font-size:14px;color:var(--mut)}
  #gate input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--txt);font:16px system-ui;outline:none}
  #gate input:focus{border-color:var(--acc)}
  #gateErr{color:var(--red);font-size:13px;min-height:16px}
  #strip{display:none;gap:10px;overflow-x:auto;overflow-y:hidden;min-height:0}
  #grid.focus:not(.solo) #strip{display:flex}
  #strip .tile{flex:0 0 auto;height:100%;aspect-ratio:16/9}
  #strip .tile .bar{padding:6px}
  #strip .tile .bar div{display:none}
  #strip .tile .bar span{font-size:12px}
  #people{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 16px 0;flex-shrink:0}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
  .chip i{width:7px;height:7px;border-radius:50%;background:#3ccf7a;display:inline-block}
  .chip.live i{background:var(--red)}
  .chip.me{cursor:pointer;border-color:#3a3a44}
  .app{display:none}
</style>
</head>
<body>
<div id="gate">
  <form id="gateForm" autocomplete="off">
    <h1>Tela Compartilhada</h1>
    <p>Escolha seu nome e digite o código de acesso.</p>
    <input id="nameInput" type="text" placeholder="Seu nome" maxlength="24" autofocus>
    <input id="gateInput" type="password" placeholder="Código de acesso">
    <div id="gateErr"></div>
    <button class="primary" type="submit">Entrar</button>
  </form>
</div>
<header class="app">
  <div class="brand">Tela Compartilhada<small>Sala principal</small></div>
  <div class="actions">
    <span class="pill"><b id="count">1</b> na sala</span>
    <button id="copyBtn">Copiar link</button>
    <button id="shareBtn" class="primary">Compartilhar minha tela</button>
  </div>
</header>
<div id="people" class="app"></div>
<div id="status" class="app">Conectando...</div>
<main id="grid" class="app">
  <div id="empty"><b>Ninguém está compartilhando ainda</b>Quem entrar com o código aparece aqui. Clique em "Compartilhar minha tela" para mostrar a sua.</div>
  <div id="strip"></div>
</main>

<script>
// Só o hash do código fica no código-fonte. O ID da sala também é derivado do código,
// então sem saber o código não dá para descobrir a sala.
const ACCESS_HASH = '0f9dbab494594994c643ed8220cec23a90eb30fb75cc02001d1079748e6fd542';
const PREFIX = 'jktela-';
let code = '';

async function sha256(txt) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

let myName = '';
const clean = t => (t || '').replace(/[<>&"']/g, '').trim().slice(0, 24);

async function tryEnter(pass, name) {
  pass = (pass || '').trim().toLowerCase();
  name = clean(name);
  if (!name) return 'nome';
  if (!pass || await sha256(pass) !== ACCESS_HASH) return 'codigo';
  myName = name;
  try { localStorage.setItem('tela_nome', name); } catch (e) {}
  code = (await sha256(pass + '|sala-principal')).slice(0, 24);
  try { localStorage.setItem('tela_acesso', pass); } catch (e) {}
  document.getElementById('gate').remove();
  document.querySelectorAll('.app').forEach(el => el.style.display = (el.tagName === 'HEADER' || el.id === 'people') ? 'flex' : (el.id === 'grid' ? 'grid' : 'block'));
  start();
  renderPeople();
  return 'ok';
}

document.getElementById('gateForm').onsubmit = async e => {
  e.preventDefault();
  const r = await tryEnter(document.getElementById('gateInput').value, document.getElementById('nameInput').value);
  if (r === 'nome') document.getElementById('gateErr').textContent = 'Digite seu nome.';
  else if (r === 'codigo') document.getElementById('gateErr').textContent = 'Código incorreto.';
};
// entra direto se nome e código já foram salvos neste navegador
(async () => {
  let pass = null, name = null;
  try { pass = localStorage.getItem('tela_acesso'); name = localStorage.getItem('tela_nome'); } catch (e) {}
  if (name) document.getElementById('nameInput').value = name;
  if (pass && name) tryEnter(pass, name);
  else if (name) document.getElementById('gateInput').focus();
})();

const $status = document.getElementById('status');
const $grid = document.getElementById('grid');
const $empty = document.getElementById('empty');
const $count = document.getElementById('count');
const $shareBtn = document.getElementById('shareBtn');
const $strip = document.getElementById('strip');
let focusId = null;   // tela em destaque

let peer = null, isHub = false, hubConn = null;
const hubConns = new Map();   // só o anfitrião usa: id -> conexão
let others = [];              // ids das outras pessoas na sala
const names = new Map();      // id -> nome
const hubNames = new Map();   // só o anfitrião usa: id -> nome
let myStream = null;
const outCalls = new Map();   // chamadas que eu fiz com a minha tela
const tiles = new Map();      // id -> elemento do vídeo

const setStatus = t => $status.textContent = t;

/* ---------- Conexão ---------- */
function start() {
  // tenta virar o anfitrião da sala; se já existir, entra como convidado
  const p = new Peer(PREFIX + code);
  p.on('open', () => { peer = p; isHub = true; wire(); setStatus('Você está na sala. Clique numa tela para dar destaque.'); updateMembers([]); });
  p.on('error', e => {
    if (e.type === 'unavailable-id') { p.destroy(); joinAsGuest(); }
    else setStatus('Erro de conexão: ' + e.type);
  });
}

function joinAsGuest() {
  const p = new Peer();
  p.on('open', () => {
    peer = p; wire();
    hubConn = peer.connect(PREFIX + code, { reliable: true, metadata: { name: myName } });
    hubConn.on('open', () => setStatus('Conectado à sala. Clique numa tela para dar destaque.'));
    hubConn.on('data', d => { if (d && d.type === 'members') updateMembers(d.list.filter(m => m.id !== peer.id)); });
    hubConn.on('close', hubLost);
  });
  p.on('error', e => {
    if (e.type === 'peer-unavailable' && hubConn && !hubConn.open) hubLost();
    else if (e.type !== 'peer-unavailable') setStatus('Erro de conexão: ' + e.type);
  });
}

function hubLost() {
  setStatus('Reconectando à sala...');
  setTimeout(() => location.reload(), 800 + Math.random() * 1500);
}

function wire() {
  peer.on('connection', conn => {
    if (!isHub) return;
    conn.on('open', () => { hubConns.set(conn.peer, conn); hubNames.set(conn.peer, clean(conn.metadata && conn.metadata.name) || 'Convidado'); broadcast(); });
    conn.on('close', () => { hubConns.delete(conn.peer); hubNames.delete(conn.peer); removeTile(conn.peer); broadcast(); });
  });
  peer.on('call', call => {
    call.answer();
    call.on('stream', s => addTile(call.peer, s, false));
    call.on('close', () => removeTile(call.peer));
    call.on('error', () => removeTile(call.peer));
  });
}

function broadcast() {
  const guests = [...hubConns.keys()].map(id => ({ id, name: hubNames.get(id) || 'Convidado' }));
  const list = [{ id: peer.id, name: myName }, ...guests];
  hubConns.forEach(c => { try { c.send({ type: 'members', list }); } catch (e) {} });
  updateMembers(guests);
}

function updateMembers(members) {
  names.clear();
  members.forEach(m => names.set(m.id, clean(m.name) || 'Convidado'));
  const list = members.map(m => m.id);
  others = list;
  tiles.forEach((t, id) => { if (id !== 'eu') t.querySelector('.bar span').textContent = names.get(id) || 'Convidado'; });
  renderPeople();
  $count.textContent = list.length + 1;
  // quem saiu: encerra chamadas e remove vídeos
  [...outCalls.keys()].forEach(id => { if (!list.includes(id)) { outCalls.get(id).close(); outCalls.delete(id); } });
  [...tiles.keys()].forEach(id => { if (id !== 'eu' && !list.includes(id)) removeTile(id); });
  // se estou compartilhando, envia para quem chegou
  if (myStream) list.forEach(callPeer);
}

function callPeer(id) {
  if (outCalls.has(id) || !myStream) return;
  const call = peer.call(id, myStream);
  if (call) { outCalls.set(id, call); call.on('close', () => outCalls.delete(id)); }
}

/* ---------- Compartilhar ---------- */
async function shareScreen() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    alert('Este navegador não permite compartilhar a tela (celulares em geral não permitem). Você ainda pode assistir.');
    return;
  }
  try {
    myStream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: true });
  } catch (e) { return; }
  myStream.getVideoTracks()[0].addEventListener('ended', stopShare);
  addTile('eu', myStream, true);
  others.forEach(callPeer);
  $shareBtn.textContent = 'Parar de compartilhar';
  $shareBtn.className = 'stop';
}

function stopShare() {
  outCalls.forEach(c => c.close()); outCalls.clear();
  if (myStream) myStream.getTracks().forEach(t => t.stop());
  myStream = null;
  removeTile('eu');
  $shareBtn.textContent = 'Compartilhar minha tela';
  $shareBtn.className = 'primary';
}

$shareBtn.onclick = () => myStream ? stopShare() : shareScreen();

/* ---------- Vídeos ---------- */
function addTile(id, stream, mine) {
  let t = tiles.get(id);
  if (t) { t.querySelector('video').srcObject = stream; return; }
  t = document.createElement('div');
  t.className = 'tile';
  const label = mine ? myName + ' (você)' : (names.get(id) || 'Convidado');
  t.innerHTML = `<video autoplay playsinline muted></video>
    <div class="bar"><span></span><div>
      ${mine ? '' : '<button data-a="som">Ativar som</button>'}
      <button data-a="full">Tela cheia</button></div></div>`;
  t.querySelector('.bar span').textContent = label;
  const v = t.querySelector('video');
  v.srcObject = stream;
  t.querySelector('[data-a="full"]').onclick = () => (t.requestFullscreen || t.webkitRequestFullscreen).call(t);
  v.ondblclick = () => (t.requestFullscreen || t.webkitRequestFullscreen).call(t);
  const som = t.querySelector('[data-a="som"]');
  if (som) som.onclick = () => { v.muted = !v.muted; som.textContent = v.muted ? 'Ativar som' : 'Silenciar'; v.play(); };
  t.dataset.id = id;
  t.querySelectorAll('button').forEach(b => b.addEventListener('click', ev => ev.stopPropagation()));
  t.addEventListener('click', () => { focusId = (focusId === id) ? null : id; layout(); });
  tiles.set(id, t);
  $grid.insertBefore(t, $strip);
  layout();
}

function removeTile(id) {
  const t = tiles.get(id);
  if (!t) return;
  t.remove(); tiles.delete(id);
  layout();
}

/* ---------- Quem está na sala ---------- */
function renderPeople() {
  const box = document.getElementById('people');
  box.innerHTML = '';
  const add = (name, live, me) => {
    const c = document.createElement('span');
    c.className = 'chip' + (live ? ' live' : '') + (me ? ' me' : '');
    c.innerHTML = '<i></i>';
    c.append(name + (me ? ' (você)' : '') + (live ? ' · ao vivo' : ''));
    if (me) { c.title = 'Clique para trocar seu nome'; c.onclick = changeName; }
    box.appendChild(c);
  };
  add(myName, !!myStream, true);
  others.forEach(id => add(names.get(id) || 'Convidado', tiles.has(id), false));
}

function changeName() {
  const n = clean(prompt('Seu nome:', myName));
  if (!n || n === myName) return;
  try { localStorage.setItem('tela_nome', n); } catch (e) {}
  if (myStream && !confirm('Para trocar o nome a página recarrega e o compartilhamento para. Continuar?')) return;
  location.reload();
}

/* ---------- Layout: grade sem scroll ou tela em destaque ---------- */
function layout() {
  const list = [...tiles.values()];
  if (focusId && !tiles.has(focusId)) focusId = null;
  $empty.style.display = list.length ? 'none' : '';
  renderPeople();
  $grid.classList.toggle('focus', !!focusId);
  $grid.classList.toggle('solo', !!focusId && list.length === 1);

  if (focusId) {
    // destaque em cima, miniaturas na faixa de baixo
    list.forEach(t => {
      const isF = t.dataset.id === focusId;
      t.classList.toggle('focused', isF);
      if (isF) { if (t.parentNode !== $grid) $grid.insertBefore(t, $strip); }
      else if (t.parentNode !== $strip) $strip.appendChild(t);
    });
  } else {
    list.forEach(t => { t.classList.remove('focused'); if (t.parentNode !== $grid) $grid.insertBefore(t, $strip); });
    // escolhe colunas/linhas que deixam cada tela 16:9 o maior possível
    const n = Math.max(list.length, 1);
    const W = $grid.clientWidth - 32, H = $grid.clientHeight - 16;
    let best = 1, bestSize = 0;
    for (let c = 1; c <= n; c++) {
      const r = Math.ceil(n / c);
      const w = (W - (c - 1) * 10) / c, h = (H - (r - 1) * 10) / r;
      const size = Math.min(w, h * 16 / 9);
      if (size > bestSize) { bestSize = size; best = c; }
    }
    const rows = Math.ceil(n / best);
    $grid.style.gridTemplateColumns = `repeat(${best}, minmax(0,1fr))`;
    $grid.style.gridTemplateRows = `repeat(${rows}, minmax(0,1fr))`;
  }
  // mover o vídeo no DOM pode pausar, então garante que continua tocando
  list.forEach(t => { const v = t.querySelector('video'); if (v.paused) v.play().catch(() => {}); });
}
window.addEventListener('resize', layout);

/* ---------- Link ---------- */
document.getElementById('copyBtn').onclick = async e => {
  try { await navigator.clipboard.writeText(location.origin + location.pathname); e.target.textContent = 'Link copiado!'; }
  catch { prompt('Copie o link:', location.origin + location.pathname); }
  setTimeout(() => e.target.textContent = 'Copiar link', 1800);
};

window.addEventListener('beforeunload', () => { if (peer) peer.destroy(); });
</script>
</body>
</html>
